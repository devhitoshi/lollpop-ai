# lollpop_docs（公開リポジトリ）の main が更新されていたら data/*.json を作り直して push する。
# push をきっかけに、デプロイナウの GitHub 連携が自動でビルド・公開する。
name: sync-data

on:
  schedule:
    - cron: "0 18 * * *" # 毎日 03:00 JST
  workflow_dispatch:
  push:
    paths:
      - "persona/**"
      - "scripts/build_data.py"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lollpop_docs の main を取得
        uses: actions/checkout@v4
        with:
          repository: devhitoshi/lollpop_docs
          ref: main
          path: _lollpop_docs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: data/*.json を生成
        run: python scripts/build_data.py --docs _lollpop_docs

      - name: 変更があればコミットして push
        run: |
          if git diff --quiet -- data; then
            echo "data に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "データ更新: lollpop_docs $(git -C _lollpop_docs rev-parse --short HEAD)"
          git push
